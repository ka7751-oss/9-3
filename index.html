<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="artifact-type" content="tool">
<meta name="design-style" content="sticker">
<title>幾點鐘：撥鐘小達人挑戰賽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;

  /* 1. Sticker style palette & effects */
  --background: #fef7ff;
  --surface-container-low: #ffffff;
  --surface-container: #f8eef8;
  --surface-container-high: #f2e8f2;

  --on-surface: #2e1a28;
  --on-surface-variant: #604868;

  --outline: #907898;
  --outline-variant: #dcc8e0;

  --primary: #c2207f;
  --on-primary: #ffffff;
  --primary-container: #f080c0;
  --on-primary-container: #2e1a28;
  --secondary: #7c52aa;
  --on-secondary: #ffffff;
  --tertiary: #0096cc;
  --on-tertiary: #ffffff;
  --error: #c53030;
  --on-error: #ffffff;

  --data-1: #c2207f;
  --data-2: #7c52aa;
  --data-3: #0096cc;
  --data-4: #d96a00;
  --data-context: #c8b8d0;

  /* Clock & scene semantic tokens */
  --clock-minute: #0077d4;
  --clock-minute-light: #e0f2fe;
  --clock-hour: #d92b4b;
  --clock-hour-light: #ffe4e8;
  --day-sky: #fff7db;
  --day-sun: #f59e0b;
  --day-sun-glow: #fde68a;
  --afternoon-sky: #ffeedd;
  --night-sky: #281b44;
  --night-sky-text: #fef7ff;
  --night-moon: #fde047;
  --cert-gold: #d98200;
  --cert-cream: #fffdf5;

  /* 2. Fonts (Non-Latin first, then DM Sans) */
  --font-headline: 'Noto Sans TC', 'DM Sans', sans-serif;
  --font-body: 'Noto Sans TC', 'DM Sans', sans-serif;
  --font-label: 'Noto Sans TC', 'DM Sans', sans-serif;

  /* Shape */
  --rounded: 1.25rem;
  --rounded-lg: 2rem;
  --rounded-full: 9999px;

  /* Style effects */
  --shadow-pink: 0 6px 20px rgb(224 64 160 / 0.18);
  --shadow-pink-deep: 0 12px 30px rgb(224 64 160 / 0.30);
  --shadow-grape: 0 6px 20px rgb(124 82 170 / 0.18);
  --shadow-sky: 0 6px 20px rgb(0 150 204 / 0.18);
  --shadow-positive: 0 6px 20px rgb(21 128 61 / 0.18);
  --pop-scale: scale(1.03);
  --lift: translateY(-3px);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* 3. Shared tokens */
  --positive: #15803d;
  --positive-container: #dcfce7;
  --warning: #b45309;
  --warning-container: #fef3c7;
  --focus: #c2207f;

  /* Type scale for Focused Tool (boosted for Grade 1 legibility + Zhuyin) */
  --display-size: clamp(1.65rem, 1.25rem + 1.4vw, 2.35rem);
  --headline-size: clamp(1.25rem, 1.05rem + 0.65vw, 1.6rem);
  --subhead-size: clamp(1.05rem, 0.98rem + 0.35vw, 1.28rem);
  --body-size: clamp(1rem, 0.95rem + 0.25vw, 1.15rem);
  --label-size: 0.85rem;

  /* Spacing scale (4pt base) */
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.25rem;
  --space-2xl: 3.5rem;
  --space-3xl: 5rem;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long: 420ms;
}

/* Base reset */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  overflow-x: clip;
  margin: 0;
  padding: 0;
  background-color: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--body-size);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
header { position: static !important; }

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Textbook right-side vertical Zhuyin */
.zy-text {
  display: inline;
  word-break: normal;
  overflow-wrap: break-word;
}

.zy-char {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  line-height: 1.1;
  margin-right: 0.08em;
  margin-bottom: 0.14em;
}

.zy-han {
  display: inline-block;
  font-weight: inherit;
  line-height: 1.15;
}

.zy-bopo {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.42em;
  line-height: 1.02;
  margin-left: 0.06em;
  padding-right: 0.48em;
  position: relative;
  min-width: 1.1em;
  font-weight: 700;
  letter-spacing: 0;
  user-select: none;
}

.zy-bopo.has-dot {
  padding-top: 0.42em;
}

.zy-tone-dot {
  position: absolute;
  top: -0.05em;
  left: 50%;
  transform: translateX(-70%);
  font-size: 0.95em;
  line-height: 1;
}

.zy-syl-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.zy-sym {
  display: block;
  line-height: 1.04;
}

.zy-tone-side {
  position: absolute;
  right: -0.58em;
  bottom: 0.05em;
  font-size: 0.95em;
  line-height: 1;
}

.zy-punc {
  display: inline-block;
  vertical-align: middle;
  margin-right: 0.06em;
}

.zy-num {
  display: inline-block;
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
  margin: 0 0.12em;
  font-weight: 800;
}

/* Page layout */
.page-grid {
  display: grid;
  gap: var(--space-lg);
  padding: var(--space-lg);
  max-width: 1160px;
  margin: 0 auto;
  overflow: hidden;
}
.page-grid * { min-width: 0; }

/* Top Banner */
.hero-header {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  box-shadow: var(--shadow-pink);
  padding: var(--space-lg) var(--space-xl);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
}

.hero-brand {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}

.kicker-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  background: var(--primary-container);
  color: var(--on-primary-container);
  border-radius: var(--rounded-full);
  padding: var(--space-xs) var(--space-md);
  font-size: var(--label-size);
  font-weight: 700;
  width: fit-content;
}

.display-title {
  margin: 0;
  font-family: var(--font-headline);
  font-weight: 900;
  font-size: var(--display-size);
  line-height: 1.25;
  color: var(--on-surface);
}

.display-title em {
  font-style: normal;
  color: var(--primary);
}

.hero-sub {
  margin: 0;
  color: var(--on-surface-variant);
  font-size: var(--body-size);
}

.toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-sm);
}

/* Buttons & Pills */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  border: none;
  border-radius: var(--rounded-full);
  padding: var(--space-sm) var(--space-lg);
  min-height: 46px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-bounce),
              box-shadow var(--dur-short) var(--ease-out),
              background-color var(--dur-micro) var(--ease-out);
  text-decoration: none;
}

.btn:hover:not(:disabled) {
  transform: var(--pop-scale);
}
.btn:active:not(:disabled) {
  transform: scale(0.97);
}
.btn:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-pink);
  font-size: var(--subhead-size);
  padding: var(--space-md) var(--space-xl);
  min-height: 56px;
}
.btn-primary:hover:not(:disabled) {
  box-shadow: var(--shadow-pink-deep);
}

.btn-secondary {
  background: var(--secondary);
  color: var(--on-secondary);
  box-shadow: var(--shadow-grape);
}

.btn-sky {
  background: var(--tertiary);
  color: var(--on-tertiary);
  box-shadow: var(--shadow-sky);
}

.btn-soft {
  background: var(--surface-container);
  color: var(--on-surface);
  border: 2px solid var(--outline-variant);
}
.btn-soft[aria-pressed="true"] {
  background: var(--primary-container);
  border-color: var(--primary);
  color: var(--on-primary-container);
}

.btn-quiet {
  background: transparent;
  color: var(--primary);
  padding: var(--space-sm) var(--space-md);
}
.btn-quiet:hover:not(:disabled) {
  background: var(--surface-container);
}

/* Progress Card */
.progress-strip {
  background: var(--surface-container-low);
  border-radius: var(--rounded);
  box-shadow: var(--shadow-grape);
  padding: var(--space-md) var(--space-lg);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
}

.level-pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-sm);
}

.level-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  min-width: 48px;
  height: 44px;
  padding: 0 var(--space-md);
  border-radius: var(--rounded-full);
  border: 2px solid var(--outline-variant);
  background: var(--surface-container);
  color: var(--on-surface-variant);
  font-weight: 800;
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-bounce),
              background-color var(--dur-short) var(--ease-out);
}
.level-pill:hover {
  transform: var(--pop-scale);
}
.level-pill.is-current {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-pink);
}
.level-pill.is-done {
  background: var(--positive-container);
  border-color: var(--positive);
  color: var(--positive);
}

.progress-track-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  flex: 1 1 220px;
  max-width: 340px;
}

.progress-track {
  flex: 1;
  height: 14px;
  border-radius: var(--rounded-full);
  background: var(--surface-container-high);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--rounded-full);
  background: var(--tertiary);
  transition: width var(--dur-long) var(--ease-bounce);
}

.progress-count {
  font-weight: 800;
  color: var(--secondary);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Main Workspace */
.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: var(--space-lg);
  align-items: start;
}

.card {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  padding: var(--space-lg);
}

.clock-card {
  box-shadow: var(--shadow-sky);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-md);
  container-type: inline-size;
}

.story-card {
  box-shadow: var(--shadow-pink);
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  container-type: inline-size;
}

/* Clock Legends */
.clock-header-row {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
}

.hand-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
}

.legend-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: var(--space-xs) var(--space-md);
  border-radius: var(--rounded-full);
  font-weight: 700;
  font-size: var(--label-size);
}

.legend-chip.is-minute {
  background: var(--clock-minute-light);
  color: var(--on-surface);
  border: 2px solid var(--clock-minute);
}
.legend-chip.is-hour {
  background: var(--clock-hour-light);
  color: var(--on-surface);
  border: 2px solid var(--clock-hour);
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: var(--rounded-full);
  display: inline-block;
}
.legend-dot.blue { background: var(--clock-minute); }
.legend-dot.red { background: var(--clock-hour); }

/* SVG Clock Container */
.clock-stage {
  position: relative;
  width: 100%;
  max-width: 410px;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: none;
}

.clock-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  display: block;
}

.clock-outer-ring {
  fill: var(--surface-container);
  stroke: var(--outline-variant);
  stroke-width: 6;
}
.clock-dial {
  fill: var(--surface-container-low);
  stroke: var(--secondary);
  stroke-width: 5;
}
.clock-cw-arc {
  fill: none;
  stroke: var(--outline-variant);
  stroke-width: 3;
  stroke-dasharray: 6 6;
}
.clock-tick-minor {
  stroke: var(--outline-variant);
  stroke-width: 2;
  stroke-linecap: round;
}
.clock-tick-major {
  stroke: var(--secondary);
  stroke-width: 4;
  stroke-linecap: round;
}
.clock-num {
  fill: var(--on-surface);
  font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  font-weight: 900;
  font-size: 27px;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}
.clock-num.is-top {
  fill: var(--primary);
}

/* Hands */
.hour-hand-group {
  cursor: not-allowed;
}
.hour-shaft {
  stroke: var(--clock-hour);
  stroke-width: 12;
  stroke-linecap: round;
}
.hour-tip {
  fill: var(--clock-hour);
}
.hour-hit-shield {
  fill: transparent;
  stroke: transparent;
  stroke-width: 26;
}

.minute-hand-group {
  cursor: grab;
}
.minute-hand-group.is-dragging {
  cursor: grabbing;
}
.minute-shaft {
  stroke: var(--clock-minute);
  stroke-width: 9;
  stroke-linecap: round;
}
.minute-tip-arrow {
  fill: var(--clock-minute);
}
.minute-knob-ring {
  fill: var(--surface-container-low);
  stroke: var(--clock-minute);
  stroke-width: 4;
}
.minute-knob-core {
  fill: var(--clock-minute);
}
.minute-knob-halo {
  fill: var(--clock-minute);
  opacity: 0.22;
}
.minute-hit-target {
  fill: transparent;
  stroke: transparent;
  stroke-width: 30;
}

.clock-center-cap {
  fill: var(--on-surface);
  stroke: var(--surface-container-low);
  stroke-width: 3;
  pointer-events: none;
}

/* Clock floating feedback pill */
.clock-toast {
  position: absolute;
  bottom: var(--space-sm);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--on-surface);
  color: var(--on-primary);
  border-radius: var(--rounded-full);
  padding: var(--space-xs) var(--space-md);
  font-size: var(--label-size);
  font-weight: 700;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-short) var(--ease-out),
              transform var(--dur-short) var(--ease-bounce);
  z-index: 5;
}
.clock-toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.clock-controls-row {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
}

.hint-box {
  width: 100%;
  background: var(--warning-container);
  color: var(--on-surface);
  border-radius: var(--rounded);
  padding: var(--space-md);
  border: 2px solid var(--warning);
  display: none;
}
.hint-box.is-open {
  display: block;
}

/* Story Panel */
.scene-banner {
  border-radius: var(--rounded);
  padding: var(--space-md) var(--space-lg);
  display: flex;
  align-items: center;
  gap: var(--space-md);
  background: var(--day-sky);
  color: var(--on-surface);
  transition: background-color var(--dur-long) var(--ease-out);
}
.scene-banner.is-afternoon {
  background: var(--afternoon-sky);
}
.scene-banner.is-night {
  background: var(--night-sky);
  color: var(--night-sky-text);
}

.scene-svg-box {
  width: 92px;
  height: 92px;
  flex-shrink: 0;
  border-radius: var(--rounded);
  background: var(--surface-container-low);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-grape);
  overflow: hidden;
}
.scene-banner.is-night .scene-svg-box {
  background: var(--secondary);
}

.scene-meta {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}

.period-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: var(--space-xs) var(--space-md);
  border-radius: var(--rounded-full);
  background: var(--surface-container-low);
  color: var(--on-surface);
  font-weight: 800;
  width: fit-content;
}

.level-title {
  margin: 0;
  font-size: var(--headline-size);
  font-weight: 800;
  line-height: 1.3;
}

.story-box {
  background: var(--surface-container);
  border-radius: var(--rounded);
  padding: var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.story-narrative {
  margin: 0;
  font-size: var(--subhead-size);
  line-height: 1.85;
}

.story-prompt {
  margin: 0;
  font-size: var(--headline-size);
  font-weight: 800;
  color: var(--primary);
  line-height: 1.5;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-md);
}

/* Feedback Banner */
.feedback-banner {
  border-radius: var(--rounded);
  padding: var(--space-md) var(--space-lg);
  display: none;
  flex-direction: column;
  gap: var(--space-sm);
}
.feedback-banner.is-success {
  display: flex;
  background: var(--positive-container);
  border: 2px solid var(--positive);
  color: var(--on-surface);
}
.feedback-banner.is-retry {
  display: flex;
  background: var(--warning-container);
  border: 2px solid var(--warning);
  color: var(--on-surface);
}

.digital-clock-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  background: var(--on-surface);
  color: var(--night-moon);
  border-radius: var(--rounded-full);
  padding: var(--space-xs) var(--space-lg);
  font-weight: 900;
  font-size: var(--subhead-size);
  font-variant-numeric: tabular-nums;
  width: fit-content;
}

/* Day Timeline Strip */
.timeline-card {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  box-shadow: var(--shadow-grape);
  padding: var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.timeline-heading {
  margin: 0;
  font-size: var(--subhead-size);
  font-weight: 800;
}

.timeline-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: var(--space-sm);
}

.timeline-item {
  border-radius: var(--rounded);
  background: var(--surface-container);
  padding: var(--space-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--space-xs);
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-bounce);
}
.timeline-item:hover {
  transform: var(--lift);
}
.timeline-item.is-active {
  border-color: var(--primary);
  background: var(--surface-container-low);
  box-shadow: var(--shadow-pink);
}
.timeline-item.is-done {
  background: var(--positive-container);
  border-color: var(--positive);
}
.timeline-time {
  font-weight: 800;
  font-size: var(--label-size);
  color: var(--secondary);
}

/* Victory & Certificate View */
.victory-panel {
  display: none;
  flex-direction: column;
  gap: var(--space-lg);
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  box-shadow: var(--shadow-pink-deep);
  padding: var(--space-xl);
}
.victory-panel.is-visible {
  display: flex;
}

.victory-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
}

.name-form-row {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: var(--space-md);
  background: var(--surface-container);
  padding: var(--space-lg);
  border-radius: var(--rounded);
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  flex: 1 1 240px;
}

.field-label {
  font-weight: 700;
  color: var(--on-surface);
}

.name-input {
  width: 100%;
  min-height: 48px;
  border-radius: var(--rounded-full);
  border: 2px solid var(--outline);
  background: var(--surface-container-low);
  color: var(--on-surface);
  padding: var(--space-sm) var(--space-lg);
  font-weight: 800;
  font-size: var(--subhead-size);
}
.name-input:focus {
  border-color: var(--primary);
  outline: none;
  box-shadow: var(--shadow-pink);
}

/* Printable Certificate Frame */
.certificate-frame {
  background: var(--cert-cream);
  border: 6px solid var(--cert-gold);
  border-radius: var(--rounded-lg);
  padding: var(--space-xl);
  position: relative;
  box-shadow: var(--shadow-grape);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--space-md);
}

.certificate-inner-border {
  width: 100%;
  border: 3px dashed var(--primary-container);
  border-radius: var(--rounded);
  padding: var(--space-xl) var(--space-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-md);
}

.cert-seal {
  width: 84px;
  height: 84px;
  border-radius: var(--rounded-full);
  background: var(--primary);
  color: var(--on-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-pink);
}

.cert-title {
  margin: 0;
  font-size: var(--display-size);
  font-weight: 900;
  color: var(--primary);
}

.cert-recipient {
  font-size: clamp(1.75rem, 1.3rem + 1.5vw, 2.5rem);
  font-weight: 900;
  color: var(--secondary);
  border-bottom: 4px solid var(--primary-container);
  padding: var(--space-xs) var(--space-xl);
  min-width: 220px;
}

.cert-body {
  max-width: 58ch;
  margin: 0;
  font-size: var(--subhead-size);
  line-height: 1.9;
}

.cert-footer {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-md);
  margin-top: var(--space-md);
  padding-top: var(--space-md);
  border-top: 2px solid var(--outline-variant);
  font-weight: 700;
  color: var(--on-surface-variant);
}

/* Confetti Canvas */
.confetti-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 50;
}

/* Animations */
@keyframes softShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.shake-once {
  animation: softShake var(--dur-short) var(--ease-out);
}

/* Responsive */
@media (max-width: 900px) {
  .workspace-grid {
    grid-template-columns: 1fr;
  }
  .timeline-grid {
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  }
}

@media (max-width: 640px) {
  .page-grid {
    padding: var(--space-sm);
    gap: var(--space-md);
  }
  .hero-header, .card, .victory-panel {
    padding: var(--space-md);
  }
  .scene-banner {
    flex-direction: column;
    text-align: center;
  }
  .scene-meta {
    align-items: center;
  }
  .certificate-frame {
    padding: var(--space-md);
  }
  .certificate-inner-border {
    padding: var(--space-md);
  }
}

/* Print Styles for Certificate */
@media print {
  body {
    background: var(--surface-container-low);
  }
  .hero-header,
  .progress-strip,
  .workspace-grid,
  .timeline-card,
  .victory-header,
  .name-form-row,
  .victory-actions,
  .confetti-canvas {
    display: none !important;
  }
  .victory-panel {
    display: flex !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
  .certificate-frame {
    box-shadow: none !important;
    page-break-inside: avoid;
  }
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

function parseZhuyinSyllable(bopo) {
  if (!bopo) return null;
  let hasDot = false;
  let toneSide = '';
  let body = bopo;

  if (body.includes('˙')) {
    hasDot = true;
    body = body.replace('˙', '');
  }
  const sideMatch = body.match(/[ˊˇˋ]$/);
  if (sideMatch) {
    toneSide = sideMatch[0];
    body = body.slice(0, -1);
  }
  return { symbols: Array.from(body), hasDot, toneSide };
}

function buildZhuyinNodes(text) {
  const frag = document.createDocumentFragment();
  if (!text) return frag;

  // Accessible plain text for screen readers
  const srSpan = document.createElement('span');
  srSpan.className = 'sr-only';
  srSpan.textContent = text;
  frag.appendChild(srSpan);

  const visualWrap = document.createElement('span');
  visualWrap.className = 'zy-text';
  visualWrap.setAttribute('aria-hidden', 'true');

  const chars = Array.from(text);
  const polyKeys = Object.keys(WORD_POLYPHONES).sort((a, b) => b.length - a.length);

  let i = 0;
  while (i < chars.length) {
    // Check polyphone word match
    let matchedWord = null;
    for (let k = 0; k < polyKeys.length; k++) {
      const w = polyKeys[k];
      if (text.startsWith(w, i)) {
        matchedWord = w;
        break;
      }
    }

    if (matchedWord) {
      const syls = WORD_POLYPHONES[matchedWord];
      const wChars = Array.from(matchedWord);
      for (let j = 0; j < wChars.length; j++) {
        visualWrap.appendChild(createZyCharEl(wChars[j], syls[j]));
      }
      i += wChars.length;
      continue;
    }

    const ch = chars[i];
    if (/[0-9:]/.test(ch)) {
      // Group contiguous digits/colons
      let numStr = ch;
      while (i + 1 < chars.length && /[0-9:]/.test(chars[i + 1])) {
        i++;
        numStr += chars[i];
      }
      const numEl = document.createElement('span');
      numEl.className = 'zy-num';
      numEl.textContent = numStr;
      visualWrap.appendChild(numEl);
      i++;
      continue;
    }

    const bopo = BOPO_DICT[ch];
    if (bopo) {
      visualWrap.appendChild(createZyCharEl(ch, bopo));
    } else {
      const punc = document.createElement('span');
      punc.className = 'zy-punc';
      punc.textContent = ch;
      visualWrap.appendChild(punc);
    }
    i++;
  }

  frag.appendChild(visualWrap);
  return frag;
}

function createZyCharEl(han, bopo) {
  const parsed = parseZhuyinSyllable(bopo);
  const wrap = document.createElement('span');
  wrap.className = 'zy-char';

  const hanEl = document.createElement('span');
  hanEl.className = 'zy-han';
  hanEl.textContent = han;
  wrap.appendChild(hanEl);

  if (parsed) {
    const bopoEl = document.createElement('span');
    bopoEl.className = 'zy-bopo' + (parsed.hasDot ? ' has-dot' : '');

    if (parsed.hasDot) {
      const dotEl = document.createElement('span');
      dotEl.className = 'zy-tone-dot';
      dotEl.textContent = '˙';
      bopoEl.appendChild(dotEl);
    }

    const col = document.createElement('span');
    col.className = 'zy-syl-row';
    for (let s = 0; s < parsed.symbols.length; s++) {
      const sym = document.createElement('span');
      sym.className = 'zy-sym';
      sym.textContent = parsed.symbols[s];
      if (s === parsed.symbols.length - 1 && parsed.toneSide) {
        const tone = document.createElement('span');
        tone.className = 'zy-tone-side';
        tone.textContent = parsed.toneSide;
        sym.style.position = 'relative';
        sym.appendChild(tone);
      }
      col.appendChild(sym);
    }
    bopoEl.appendChild(col);
    wrap.appendChild(bopoEl);
  }

  return wrap;
}

function setZyContent(el, text) {
  if (!el) return;
  el.textContent = '';
  el.appendChild(buildZhuyinNodes(text));
}

function applyAllStaticZhuyin() {
  const targets = document.querySelectorAll('[data-zy]');
  targets.forEach((el) => {
    const raw = el.getAttribute('data-zy');
    if (raw) setZyContent(el, raw);
  });
}

    targetHour: 9,
    digitalText: '晚上 9 : 00',
    successMsg: '恭喜全部過關！短針指著 9，長針指著 12，現在是晚上 9 點鐘！',

// ============================================================================
// 3. App State & Shim Persistence
// ============================================================================
let appState = {
  currentLevelIdx: 0,
  completedIds: [],
  studentName: '',
  soundEnabled: true,
  autoSpeak: true
};

// Continuous cumulative minutes on the 12-hour dial (0 .. infinity, 60 min = 1 full minute-hand circle)
let totalMinutes = 360; // starts at 6:00 for Level 1
let isDragging = false;
let lastToastTime = 0;
let lastTickStep = 0;
let audioCtx = null;

// ============================================================================
// 4. Web Audio Synthesizer & Speech Synthesis
// ============================================================================
function getAudioContext() {
  if (!appState.soundEnabled) return null;
  if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function playTickSound() {
  const ctx = getAudioContext();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(680, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.03);
  gain.gain.setValueAtTime(0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.04);
}

function playBoopSound() {
  const ctx = getAudioContext();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(240, ctx.currentTime);
  osc.frequency.linearRampToValueAtTime(170, ctx.currentTime + 0.14);
  gain.gain.setValueAtTime(0.12, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.17);
}

function playSuccessChime() {
  const ctx = getAudioContext();
  if (!ctx) return;
  const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
  notes.forEach((freq, idx) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const t = ctx.currentTime + idx * 0.09;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.16, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.36);
  });
}

function playVictoryFanfare() {
  const ctx = getAudioContext();
  if (!ctx) return;
  const notes = [
    { f: 523.25, d: 0.00 },
    { f: 659.25, d: 0.10 },
    { f: 783.99, d: 0.20 },
    { f: 1046.5, d: 0.32 },
    { f: 783.99, d: 0.48 },
    { f: 1046.5, d: 0.60 }
  ];
  notes.forEach((n) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const t = ctx.currentTime + n.d;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(n.f, t);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.45);
  });
}

function speakText(text) {
  if (!appState.soundEnabled) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    utter.rate = 0.92;
    utter.pitch = 1.08;
    const voices = window.speechSynthesis.getVoices();
    const twVoice = voices.find((v) => v.lang && v.lang.toLowerCase().includes('zh-tw'));
    if (twVoice) utter.voice = twVoice;
    window.speechSynthesis.speak(utter);
  } catch (e) {
    // Graceful fallback if speech synthesis is restricted
  }
}

// ============================================================================
// 5. Clock Geometry & Strict Clockwise-Only Drag Physics
// ============================================================================
function buildClockFace() {
  const ticksGroup = document.getElementById('clock-ticks');
  const numsGroup = document.getElementById('clock-numbers');
  if (!ticksGroup || !numsGroup) return;

  const ns = 'http://www.w3.org/2000/svg';
  ticksGroup.textContent = '';
  numsGroup.textContent = '';

  for (let m = 0; m < 60; m++) {
    const angleRad = (m * 6 * Math.PI) / 180;
    const isMajor = m % 5 === 0;
    const rOuter = 160;
    const rInner = isMajor ? 144 : 152;
    const x1 = 200 + rInner * Math.sin(angleRad);
    const y1 = 200 - rInner * Math.cos(angleRad);
    const x2 = 200 + rOuter * Math.sin(angleRad);
    const y2 = 200 - rOuter * Math.cos(angleRad);

    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));
    line.setAttribute('class', isMajor ? 'clock-tick-major' : 'clock-tick-minor');
    ticksGroup.appendChild(line);
  }

  for (let h = 1; h <= 12; h++) {
    const angleRad = (h * 30 * Math.PI) / 180;
    const rNum = 120;
    const nx = 200 + rNum * Math.sin(angleRad);
    const ny = 200 - rNum * Math.cos(angleRad);

    const txt = document.createElementNS(ns, 'text');
    txt.setAttribute('x', nx.toFixed(2));
    txt.setAttribute('y', ny.toFixed(2));
    txt.setAttribute('class', h === 12 ? 'clock-num is-top' : 'clock-num');
    txt.textContent = String(h);
    numsGroup.appendChild(txt);
  }
}

function updateClockHands() {
  const minuteGroup = document.getElementById('minute-hand-group');
  const hourGroup = document.getElementById('hour-hand-group');
  if (!minuteGroup || !hourGroup) return;

  // Gear ratio: minute hand = 6 deg per minute; hour hand = 0.5 deg per minute (12:1 locked ratio)
  const minuteDeg = ((totalMinutes % 60) + 60) % 60 * 6;
  const hourDeg = ((totalMinutes % 720) + 720) % 720 * 0.5;

  minuteGroup.setAttribute('transform', `rotate(${minuteDeg.toFixed(3)} 200 200)`);
  hourGroup.setAttribute('transform', `rotate(${hourDeg.toFixed(3)} 200 200)`);
  minuteGroup.setAttribute('aria-valuenow', String(Math.round(totalMinutes % 720)));
}

function showClockToast(msg) {
  const now = Date.now();
  if (now - lastToastTime < 900) return;
  lastToastTime = now;

  const toast = document.getElementById('clock-toast');
  const stage = document.getElementById('clock-stage');
  if (!toast) return;
  setZyContent(toast, msg);
  toast.classList.add('is-visible');
  if (stage) {
    stage.classList.remove('shake-once');
    void stage.offsetWidth;
    stage.classList.add('shake-once');
  }
  playBoopSound();

  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toast.classList.remove('is-visible');
  }, 1800);
}

function getClockPointerDeg(clientX, clientY) {
  const svg = document.getElementById('clock-svg');
  if (!svg) return null;
  const rect = svg.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = clientX - cx;
  const dy = clientY - cy;
  const dist = Math.hypot(dx, dy);
  // Ignore clicks right on the pivot center to prevent wild angle flips
  if (dist < rect.width * 0.05) return null;

  let deg = (Math.atan2(dx, -dy) * 180) / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}

function setupClockInteractions() {
  const minuteGroup = document.getElementById('minute-hand-group');
  const hourGroup = document.getElementById('hour-hand-group');
  if (!minuteGroup || !hourGroup) return;

  hourGroup.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    showClockToast('紅色短針鎖住囉！請拉動藍色長針。');
  });

  minuteGroup.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    getAudioContext();
    isDragging = true;
    minuteGroup.classList.add('is-dragging');
    try {
      minuteGroup.setPointerCapture(e.pointerId);
    } catch (err) {}
    lastTickStep = Math.floor(totalMinutes / 5);
  });

  minuteGroup.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const pointerDeg = getClockPointerDeg(e.clientX, e.clientY);
    if (pointerDeg === null) return;

    const currentMinuteDeg = (((totalMinutes % 60) + 60) % 60) * 6;
    let delta = pointerDeg - currentMinuteDeg;
    if (delta > 180) delta -= 360;
    if (delta <= -180) delta += 360;

    // STRICT CLOCKWISE ONLY: Reject negative deltas beyond tiny 1.5° sensor jitter
    if (delta < -1.5) {
      showClockToast('時鐘只能順時針往前轉，不能倒退喔！');
      return;
    }

    if (delta > 0 && delta < 145) {
      totalMinutes += delta / 6;
      updateClockHands();

      const step = Math.floor(totalMinutes / 5);
      if (step !== lastTickStep) {
        lastTickStep = step;
        playTickSound();
      }
    }
  });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    minuteGroup.classList.remove('is-dragging');
    try {
      minuteGroup.releasePointerCapture(e.pointerId);
    } catch (err) {}

    // Gentle snap when very close to exact o'clock (within ±12 deg = ±2 min)
    const modMin = ((totalMinutes % 60) + 60) % 60;
    if (modMin <= 2.2) {
      totalMinutes = Math.round(totalMinutes - modMin);
    } else if (modMin >= 57.8) {
      totalMinutes = Math.round(totalMinutes + (60 - modMin));
    } else {
      totalMinutes = Math.round(totalMinutes);
    }
    updateClockHands();
  }

  minuteGroup.addEventListener('pointerup', endDrag);
  minuteGroup.addEventListener('pointercancel', endDrag);

  // Keyboard support (clockwise only!)
  minuteGroup.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === ' ') {
      e.preventDefault();
      totalMinutes += 15;
      updateClockHands();
      playTickSound();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      showClockToast('時鐘只能順時針往前轉，不能倒退喔！');
    }
  });
}

function renderLevelPills() {
  const container = document.getElementById('level-pills');
  const progressText = document.getElementById('progress-text');
  const progressFill = document.getElementById('progress-fill');
  const certBtn = document.getElementById('btn-open-cert');
  if (!container) return;

  container.textContent = '';
  LEVELS.forEach((lvl, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isDone = appState.completedIds.includes(lvl.id);
    const isCurrent = idx === appState.currentLevelIdx;
    btn.className = 'level-pill' + (isCurrent ? ' is-current' : '') + (isDone && !isCurrent ? ' is-done' : '');
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', isCurrent ? 'true' : 'false');
    btn.setAttribute('aria-label', `第 ${lvl.id} 關：${lvl.shortLabel}`);
    btn.onclick = () => selectLevel(idx);
    btn.textContent = isDone ? `⭐ ${lvl.id}` : `${lvl.id}`;
    container.appendChild(btn);
  });

  const doneCount = appState.completedIds.length;
  if (progressText) progressText.textContent = `${doneCount} / ${LEVELS.length}`;
  if (progressFill) progressFill.style.width = `${Math.round((doneCount / LEVELS.length) * 100)}%`;
  if (certBtn) {
    certBtn.style.display = doneCount >= LEVELS.length ? 'inline-flex' : 'none';
  }
}

function renderTimeline() {
  const grid = document.getElementById('timeline-grid');
  if (!grid) return;
  grid.textContent = '';

  LEVELS.forEach((lvl, idx) => {
    const item = document.createElement('button');
    item.type = 'button';
    const isDone = appState.completedIds.includes(lvl.id);
    const isActive = idx === appState.currentLevelIdx;
    item.className = 'timeline-item' + (isActive ? ' is-active' : '') + (isDone ? ' is-done' : '');
    item.onclick = () => selectLevel(idx);

    const icon = document.createElement('span');
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = lvl.skyEmoji;

    const timeEl = document.createElement('span');
    timeEl.className = 'timeline-time';
    setZyContent(timeEl, `${lvl.period} ${lvl.targetHour} 點`);

    const labelEl = document.createElement('span');
    setZyContent(labelEl, lvl.shortLabel);

    item.appendChild(icon);
    item.appendChild(timeEl);
    item.appendChild(labelEl);
    grid.appendChild(item);
  });
}

function renderCurrentLevel(shouldSpeak) {
  const lvl = LEVELS[appState.currentLevelIdx];
  if (!lvl) return;

  // Set clock start position for this level
  totalMinutes = lvl.startHour * 60;
  updateClockHands();

  // Scene banner
  const banner = document.getElementById('scene-banner');
  if (banner) {
    banner.className = 'scene-banner' +
      (lvl.skyType === 'afternoon' ? ' is-afternoon' : '') +
      (lvl.skyType === 'night' ? ' is-night' : '');
  }

  const svgBox = document.getElementById('scene-svg-box');
  if (svgBox) svgBox.innerHTML = getSceneSvgMarkup(lvl.sceneKey);

  const periodBadge = document.getElementById('period-badge');
  if (periodBadge) {
    periodBadge.textContent = '';
    const em = document.createElement('span');
    em.setAttribute('aria-hidden', 'true');
    em.textContent = lvl.skyEmoji;
    const tx = document.createElement('span');
    setZyContent(tx, `${lvl.period}・${lvl.skyHint}`);
    periodBadge.appendChild(em);
    periodBadge.appendChild(tx);
  }

  setZyContent(document.getElementById('level-title'), lvl.title);
  setZyContent(document.getElementById('story-narrative'), lvl.story);
  setZyContent(document.getElementById('story-prompt'), lvl.prompt);
  setZyContent(
    document.getElementById('hint-text'),
    `整點的時候，藍色長針要指著 12，紅色短針要指著 ${lvl.targetHour} 喔！`
  );

  // Close hint & clear feedback
  const hintBox = document.getElementById('hint-box');
  const hintBtn = document.getElementById('btn-hint-toggle');
  if (hintBox) hintBox.classList.remove('is-open');
  if (hintBtn) hintBtn.setAttribute('aria-expanded', 'false');

  const fb = document.getElementById('feedback-banner');
  if (fb) fb.className = 'feedback-banner';

  renderLevelPills();
  renderTimeline();

  if (shouldSpeak && appState.autoSpeak) {
    speakText(`${lvl.title}。${lvl.story}${lvl.prompt}`);
  }
}

// ============================================================================
// 8. Interactive Handlers (All hoisted `function` declarations for onclick)
// ============================================================================
function selectLevel(idx) {
  if (idx < 0 || idx >= LEVELS.length) return;
  appState.currentLevelIdx = idx;
  hideCertificateView();
  renderCurrentLevel(true);
  saveAppState();
}

function resetLevelClock() {
  const lvl = LEVELS[appState.currentLevelIdx];
  if (!lvl) return;
  totalMinutes = lvl.startHour * 60;
  updateClockHands();
  playTickSound();
}

function toggleHint() {
  const hintBox = document.getElementById('hint-box');
  const hintBtn = document.getElementById('btn-hint-toggle');
  if (!hintBox || !hintBtn) return;
  const open = hintBox.classList.toggle('is-open');
  hintBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function speakCurrentQuestion() {
  const lvl = LEVELS[appState.currentLevelIdx];
  if (!lvl) return;
  speakText(`${lvl.story}${lvl.prompt}`);
}

function checkAnswer() {
  const lvl = LEVELS[appState.currentLevelIdx];
  if (!lvl) return;

  const fb = document.getElementById('feedback-banner');
  const fbText = document.getElementById('feedback-text');
  const fbDigital = document.getElementById('feedback-digital');
  const fbNextRow = document.getElementById('feedback-next-row');
  const nextLabel = document.getElementById('next-btn-label');
  if (!fb || !fbText || !fbDigital || !fbNextRow || !nextLabel) return;

  // Compute current clock reading from totalMinutes
  const normalizedMin = ((Math.round(totalMinutes) % 720) + 720) % 720;
  const currentHourRaw = Math.floor(normalizedMin / 60);
  const currentMin = normalizedMin % 60;
  const displayHour = currentHourRaw === 0 ? 12 : currentHourRaw;

  const isMinuteAtTop = currentMin <= 2 || currentMin >= 58;
  // If currentMin is 58 or 59, the effective snapped hour is next hour
  const effectiveHour = currentMin >= 58 ? (displayHour % 12) + 1 : displayHour;

  if (isMinuteAtTop && effectiveHour === lvl.targetHour) {
    // Snap cleanly to exact hour
    totalMinutes = Math.round(totalMinutes / 60) * 60;
    updateClockHands();

    if (!appState.completedIds.includes(lvl.id)) {
      appState.completedIds.push(lvl.id);
    }

    fb.className = 'feedback-banner is-success';
    fbDigital.style.display = 'inline-flex';
    setZyContent(fbDigital, `數字鐘：${lvl.digitalText}`);
    setZyContent(fbText, lvl.successMsg);

    const isLast = appState.currentLevelIdx === LEVELS.length - 1;
    const allCleared = appState.completedIds.length >= LEVELS.length;
    setZyContent(nextLabel, (isLast || allCleared) ? '🏆 領取撥鐘小達人獎狀' : '下一關');
    fbNextRow.style.display = 'block';

    playSuccessChime();
    speakText(lvl.successMsg);
    renderLevelPills();
    renderTimeline();
    saveAppState();
  } else {
    fb.className = 'feedback-banner is-retry';
    fbDigital.style.display = 'none';
    fbNextRow.style.display = 'none';

    let msg = '';
    if (!isMinuteAtTop) {
      msg = '還差一點點喔！整點時，藍色長針要指著 12，再順時針轉轉看。';
    } else {
      msg = `藍色長針指著 12 了，很棒！不過紅色短針現在指著 ${effectiveHour}，我們要撥到 ${lvl.targetHour} 點鐘喔！`;
    }
    setZyContent(fbText, msg);
    playBoopSound();
    speakText(msg);
  }
}

function goToNextLevel() {
  const allCleared = appState.completedIds.length >= LEVELS.length;
  if (appState.currentLevelIdx >= LEVELS.length - 1 || allCleared) {
    showCertificateView();
    return;
  }
  appState.currentLevelIdx += 1;
  renderCurrentLevel(true);
  saveAppState();
}

function toggleSound() {
  appState.soundEnabled = !appState.soundEnabled;
  const btn = document.getElementById('btn-sound');
  const lbl = document.getElementById('sound-label');
  if (btn) btn.setAttribute('aria-pressed', appState.soundEnabled ? 'true' : 'false');
  if (lbl) setZyContent(lbl, appState.soundEnabled ? '音效開啟' : '音效關閉');
  if (!appState.soundEnabled && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  saveAppState();
}

function toggleAutoSpeak() {
  appState.autoSpeak = !appState.autoSpeak;
  const btn = document.getElementById('btn-autospeak');
  if (btn) btn.setAttribute('aria-pressed', appState.autoSpeak ? 'true' : 'false');
  saveAppState();
}

function handleResetAll(btn) {
  const lbl = document.getElementById('reset-all-label');
  if (btn.dataset.armed !== 'true') {
    btn.dataset.armed = 'true';
    if (lbl) setZyContent(lbl, '再按一次重頭開始');
    clearTimeout(btn._armTimer);
    btn._armTimer = setTimeout(() => {
      btn.dataset.armed = 'false';
      if (lbl) setZyContent(lbl, '重新挑戰');
    }, 3200);
    return;
  }
  btn.dataset.armed = 'false';
  if (lbl) setZyContent(lbl, '重新挑戰');
  appState.currentLevelIdx = 0;
  appState.completedIds = [];
  hideCertificateView();
  renderCurrentLevel(true);
  saveAppState();
}

function updateCertificatePreview() {

function launchConfetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const styles = getComputedStyle(document.documentElement);
  const colors = [
    styles.getPropertyValue('--primary').trim(),
    styles.getPropertyValue('--secondary').trim(),
    styles.getPropertyValue('--tertiary').trim(),
    styles.getPropertyValue('--day-sun').trim(),
    styles.getPropertyValue('--positive').trim()
  ];

  const particles = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * 240,
    vx: (Math.random() - 0.5) * 4,
    vy: 2.5 + Math.random() * 4,
    size: 7 + Math.random() * 8,
    rot: Math.random() * Math.PI * 2,
    vRot: (Math.random() - 0.5) * 0.14,
    color: colors[Math.floor(Math.random() * colors.length)]
  }));

  let frame = 0;
  cancelAnimationFrame(canvas._animId);
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vRot;
      if (p.y < canvas.height + 30) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
      ctx.restore();
    }
    frame++;
    if (alive && frame < 240) {
      canvas._animId = requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  tick();
}

function downloadCertificatePng() {
  const styles = getComputedStyle(document.documentElement);
  const bgCream = styles.getPropertyValue('--cert-cream').trim() || '#fffdf5';
  const gold = styles.getPropertyValue('--cert-gold').trim() || '#d98200';
  const pink = styles.getPropertyValue('--primary').trim() || '#c2207f';
  const pinkLight = styles.getPropertyValue('--primary-container').trim() || '#f080c0';
  const grape = styles.getPropertyValue('--secondary').trim() || '#7c52aa';
  const plum = styles.getPropertyValue('--on-surface').trim() || '#2e1a28';
  const plumSoft = styles.getPropertyValue('--on-surface-variant').trim() || '#604868';
  const sky = styles.getPropertyValue('--tertiary').trim() || '#0096cc';

  const canvas = document.createElement('canvas');
  canvas.width = 1600;
  canvas.height = 1120;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  // Background
  ctx.fillStyle = bgCream;
  ctx.fillRect(0, 0, 1600, 1120);

  // Outer gold border
  ctx.strokeStyle = gold;
  ctx.lineWidth = 22;
  ctx.strokeRect(36, 36, 1528, 1048);

  // Inner dashed pink border
  ctx.save();
  ctx.setLineDash([18, 14]);
  ctx.strokeStyle = pinkLight;
  ctx.lineWidth = 8;
  ctx.strokeRect(74, 74, 1452, 972);
  ctx.restore();

  // Corner decorative dots
  const corners = [[120, 120], [1480, 120], [120, 1000], [1480, 1000]];
  corners.forEach(([x, y], idx) => {
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.fillStyle = idx % 2 === 0 ? pink : sky;
    ctx.fill();
  });

  // Top Clock Emblem
  ctx.beginPath();
  ctx.arc(800, 195, 64, 0, Math.PI * 2);
  ctx.fillStyle = pink;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(800, 195, 42, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(800, 195);
  ctx.lineTo(800, 166);
  ctx.moveTo(800, 195);
  ctx.lineTo(824, 195);
  ctx.stroke();

  // Title
  ctx.fillStyle = pink;
  ctx.textAlign = 'center';
  ctx.font = '900 68px "Noto Sans TC", "DM Sans", sans-serif';
  ctx.fillText('撥鐘小達人榮譽獎狀', 800, 340);

  // Recipient name
  const cleanName = (appState.studentName || '').trim() || '小小達人';
  ctx.fillStyle = grape;
  ctx.font = '900 64px "Noto Sans TC", "DM Sans", sans-serif';
  ctx.fillText(`${cleanName} 小朋友`, 800, 470);

  ctx.strokeStyle = pinkLight;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(500, 498);
  ctx.lineTo(1100, 498);
  ctx.stroke();

  // Body lines
  ctx.fillStyle = plum;
  ctx.font = '700 34px "Noto Sans TC", "DM Sans", sans-serif';
  ctx.fillText('完成「幾點鐘」全部七道生活作息撥鐘挑戰，', 800, 590);
  ctx.fillText('能正確辨識長針、短針與上午、中午、下午、晚上的整點時刻，', 800, 650);
  ctx.fillText('表現非常優秀，特頒此狀，以資鼓勵！', 800, 710);

  // Stars row
  ctx.fillStyle = gold;
  ctx.font = '700 40px "Noto Sans TC", sans-serif';
  ctx.fillText('★  ★  ★  ★  ★  ★  ★', 800, 800);

  // Footer
  const now = new Date();
  const dateStr = `頒發日期：${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日`;
  ctx.fillStyle = plumSoft;
  ctx.font = '700 28px "Noto Sans TC", "DM Sans", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('頒發單位：一年級數學時間探索學院', 150, 940);
  ctx.textAlign = 'right';
  ctx.fillText(dateStr, 1450, 940);

  const dataUrl = canvas.toDataURL('image/png');
  const base64 = dataUrl && dataUrl.includes(',') ? dataUrl.split(',')[1] : '';
  const filename = `撥鐘小達人獎狀_${cleanName}.png`;

  if (window.notebookAppApi && typeof window.notebookAppApi.triggerFileDownload === 'function') {
    window.notebookAppApi.triggerFileDownload({
      content: base64,
      contentType: 'image/png',
      encoding: 'base64',
      filename: filename
    });
  } else {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
}

function printCertificate() {
  window.print();
}

// ============================================================================
// 10. Initialization & Persistence Wiring
// ============================================================================
async function saveAppState() {
  if (!window.notebookAppApi || typeof window.notebookAppApi.setAppState !== 'function') return;
  try {
    await window.notebookAppApi.setAppState({
      currentLevelIdx: appState.currentLevelIdx,
      completedIds: appState.completedIds,
      studentName: appState.studentName,
      soundEnabled: appState.soundEnabled,
      autoSpeak: appState.autoSpeak
    });
  } catch (e) {
    // Ignore transient persistence errors
  }
}

async function initApp() {
  applyAllStaticZhuyin();
  buildClockFace();
  setupClockInteractions();

  if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === 'function') {
    try {
      const saved = await window.notebookAppApi.getAppState();
      if (saved && typeof saved === 'object') {
        if (typeof saved.currentLevelIdx === 'number' && saved.currentLevelIdx >= 0 && saved.currentLevelIdx < LEVELS.length) {
          appState.currentLevelIdx = saved.currentLevelIdx;
        }
        if (Array.isArray(saved.completedIds)) {
          appState.completedIds = saved.completedIds.filter((id) => LEVELS.some((l) => l.id === id));
        }
        if (typeof saved.studentName === 'string') {
          appState.studentName = saved.studentName;
        }
        if (typeof saved.soundEnabled === 'boolean') {
          appState.soundEnabled = saved.soundEnabled;
        }
        if (typeof saved.autoSpeak === 'boolean') {
          appState.autoSpeak = saved.autoSpeak;
        }
      }
    } catch (e) {
      // Proceed with defaults
    }
  }

  // Sync toolbar toggle states
  const btnSound = document.getElementById('btn-sound');
  const lblSound = document.getElementById('sound-label');
  if (btnSound) btnSound.setAttribute('aria-pressed', appState.soundEnabled ? 'true' : 'false');
  if (lblSound) setZyContent(lblSound, appState.soundEnabled ? '音效開啟' : '音效關閉');

  const btnAuto = document.getElementById('btn-autospeak');
  if (btnAuto) btnAuto.setAttribute('aria-pressed', appState.autoSpeak ? 'true' : 'false');

  updateCertificatePreview();
  renderCurrentLevel(false);

  if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === 'function') {
    window.notebookAppApi.notifyAppReady();
  }
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
